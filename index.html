<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApnaGo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

header{
  background:#ff5a1f;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  font-size:28px;
}

.container{
  padding:20px;
  max-width:600px;
  margin:auto;
}

.location{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
}

.services{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.service{
  background:white;
  padding:25px 10px;
  border-radius:15px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 2px 8px #ddd;
}

.service:last-child{
  grid-column:1/3;
}

.icon{
  font-size:40px;
  margin-bottom:10px;
}

.section{
  display:none;
  margin-top:25px;
}

.card{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 2px 7px #ddd;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#ff5a1f;
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}

input,select{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

.back{
  background:#555;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:12px 5px;
  box-shadow:0 -2px 8px #ddd;
}

nav button{
  background:white;
  color:#222;
  margin:0;
  padding:8px;
  font-size:13px;
}

.order{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<header>
<h1>🚀 ApnaGo</h1>
<p>Food • Parcel • Ride</p>
</header>

<div class="container">

<div class="location">
📍 <b>Your Location</b>
<p>Munger, Bihar</p>
</div>

<div id="home">

<h2>Aapko kya chahiye?</h2>
<br>

<div class="services">

<div class="service" onclick="showSection('food')">
<div class="icon">🍔</div>
Food
</div>

<div class="service" onclick="showSection('parcel')">
<div class="icon">📦</div>
Parcel
</div>

<div class="service" onclick="showSection('ride')">
<div class="icon">🛵</div>
Ride
</div>

</div>

</div>


<!-- FOOD -->

<div id="food" class="section">

<h2>🍔 Food Delivery</h2>
<br>

<div class="card">
<h3>🍕 Apna Pizza</h3>
<p>⭐ 4.5 • 25 min</p>
<button onclick="addOrder('Pizza - ₹199')">
Order Pizza ₹199
</button>
</div>

<div class="card">
<h3>🍔 Munger Burger</h3>
<p>⭐ 4.2 • 20 min</p>
<button onclick="addOrder('Burger - ₹129')">
Order Burger ₹129
</button>
</div>

<button class="back" onclick="home()">← Back</button>

</div>


<!-- PARCEL -->

<div id="parcel" class="section">

<h2>📦 Parcel Delivery</h2>
<br>

<div class="card">

<label>Pickup Location</label>
<input id="pickup" placeholder="Pickup address">

<label>Drop Location</label>
<input id="drop" placeholder="Drop address">

<label>Parcel Type</label>

<select id="parcelType">
<option>Document</option>
<option>Clothes</option>
<option>Grocery</option>
<option>Electronics</option>
<option>Other</option>
</select>

<p><b>Estimated Fare: ₹79</b></p>

<button onclick="bookParcel()">
📦 Book Parcel
</button>

</div>

<button class="back" onclick="home()">← Back</button>

</div>


<!-- RIDE -->

<div id="ride" class="section">

<h2>🛵 Book a Ride</h2>
<br>

<div class="card">

<label>Pickup</label>
<input id="ridePickup" placeholder="Pickup location">

<label>Destination</label>
<input id="rideDrop" placeholder="Where to?">

<select id="vehicle">
<option>🏍️ Bike - ₹49</option>
<option>🛺 Auto - ₹79</option>
<option>🚗 Cab - ₹129</option>
</select>

<button onclick="bookRide()">
🛵 Book Ride
</button>

</div>

<button class="back" onclick="home()">← Back</button>

</div>


<!-- ORDERS -->

<div id="orders" class="section">

<h2>📋 My Orders</h2>
<br>

<div id="orderList">

<p>No orders yet.</p>

</div>

<button class="back" onclick="home()">← Home</button>

</div>

</div>


<nav>

<button onclick="home()">🏠<br>Home</button>

<button onclick="showSection('orders')">
📋<br>Orders
</button>

</nav>


<script>

let orders=[];

function hideAll(){

document.getElementById("home").style.display="none";

document.querySelectorAll(".section").forEach(
s=>s.style.display="none"
);

}

function showSection(id){

hideAll();

document.getElementById(id).style.display="block";

window.scrollTo(0,0);

}

function home(){

hideAll();

document.getElementById("home").style.display="block";

}

function addOrder(item){

orders.push("🍔 Food Order: "+item);

updateOrders();

alert("✅ Food order placed!");

showSection("orders");

}

function bookParcel(){

let pickup=document.getElementById("pickup").value;

let drop=document.getElementById("drop").value;

if(!pickup || !drop){

alert("Pickup aur Drop location bhariye.");

return;

}

orders.push(
"📦 Parcel: "+pickup+" → "+drop+" | ₹79"
);

updateOrders();

alert("✅ Parcel booking successful!");

showSection("orders");

}

function bookRide(){

let pickup=document.getElementById("ridePickup").value;

let drop=document.getElementById("rideDrop").value;

let vehicle=document.getElementById("vehicle").value;

if(!pickup || !drop){

alert("Pickup aur Destination bhariye.");

return;

}

orders.push(
"🛵 Ride: "+pickup+" → "+drop+" | "+vehicle
);

updateOrders();

alert("✅ Ride booking successful!");

showSection("orders");

}

function updateOrders(){

let list=document.getElementById("orderList");

list.innerHTML="";

orders.forEach((order,index)=>{

let div=document.createElement("div");

div.className="order";

div.innerHTML=
"<b>Order #"+(index+1)+"</b><br>"+order+
"<br><small>🟡 Booking Received</small>";

list.appendChild(div);

});

}

home();

</script>

</body>
  </html>
